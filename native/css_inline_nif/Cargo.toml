[package]
name = "css_inline_nif"
version = "0.2.1"
edition = "2021"
authors = ["Knock Labs"]
publish = false

[lib]
name = "css_inline_nif"
crate-type = ["cdylib"]

[features]
default = []
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
nif_version_2_17 = ["rustler/nif_version_2_17"]

[dependencies]
rustler = "0.37"
css-inline = { git = "https://github.com/knocklabs/css-inline", rev = "5c22550a5427e87ec525fbec757457c0baa29bf3" }
